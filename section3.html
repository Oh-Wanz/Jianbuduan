<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政策及行业分析 | 检不断 理不乱</title>
    <style>
        :root {
            --sidebar-bg: #4b5563;
            --sidebar-hover: #6b7280;
            --sidebar-active: #f97316;
            --sidebar-text: #d1d5db;
            --sidebar-text-active: #ffffff;
            --bg-gradient-start: #fff7ed;
            --bg-gradient-end: #ffffff;
            --primary: #f97316;
            --primary-light: #fff7ed;
            --primary-dark: #c2410c;
            --card: #ffffff;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --text-light: #9ca3af;
            --border: #f3f4f6;
            --accent-violet: #7c3aed;
            --accent-violet-light: #ede9fe;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-card: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
        }

        /* ========== Sidebar ========== */
        .sidebar {
            width: 220px;
            min-height: 100vh;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0; bottom: 0;
            z-index: 100;
        }
        .sidebar-logo { padding: 28px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .sidebar-logo .logo-text { font-size: 20px; font-weight: 700; color: var(--sidebar-text-active); letter-spacing: 1px; }
        .sidebar-logo .logo-sub { font-size: 11px; color: var(--sidebar-text); margin-top: 4px; opacity: 0.7; }
        .sidebar-nav { flex: 1; padding: 16px 12px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            border-radius: var(--radius-sm); color: var(--sidebar-text); text-decoration: none;
            font-size: 14px; font-weight: 500; transition: all 0.25s ease; margin-bottom: 4px;
        }
        .nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
        .nav-item.active { background: var(--sidebar-active); color: var(--sidebar-text-active); box-shadow: 0 2px 8px rgba(249,115,22,0.3); }
        .nav-icon { width: 20px; text-align: center; font-size: 16px; }
        .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: var(--sidebar-text); opacity: 0.5; }

        /* ========== Main ========== */
        .main { flex: 1; margin-left: 220px; min-height: 100vh; display: flex; flex-direction: column; }

        /* Page Header */
        .page-header {
            background: var(--card);
            padding: 24px 32px 20px;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .page-header h1 {
            font-size: 22px; font-weight: 700;
            background: linear-gradient(135deg, #ea580c, #f97316, #f472b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        @supports not (-webkit-background-clip: text) {
            .page-header h1 { background: none; -webkit-text-fill-color: initial; color: var(--primary); }
        }
        .page-header .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

        /* Container */
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; width: 100%; }

        /* Placeholder */
        .placeholder { background: var(--card); border-radius: var(--radius); padding: 64px 32px; text-align: center; box-shadow: var(--shadow-card); }
        .placeholder .icon { font-size: 56px; margin-bottom: 16px; }
        .placeholder h2 { font-size: 20px; margin-bottom: 12px; }
        .placeholder p { font-size: 14px; color: var(--text-secondary); max-width: 500px; margin: 0 auto; line-height: 1.8; }
        .placeholder .features { display: flex; gap: 16px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
        .placeholder .feat { background: var(--accent-violet-light); color: var(--accent-violet); padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 500; }

        /* Footer */
        .page-footer { text-align: center; padding: 24px; color: var(--text-light); font-size: 11px; border-top: 1px solid var(--border); margin-top: auto; }

        /* Responsive */
        @media (max-width: 900px) {
            .sidebar { width: 60px; }
            .sidebar-logo .logo-text, .sidebar-logo .logo-sub { display: none; }
            .nav-item span:not(.nav-icon) { display: none; }
            .nav-item { justify-content: center; padding: 12px; }
            .sidebar-footer { display: none; }
            .main { margin-left: 60px; }
            .page-header h1 { font-size: 18px; }
        }
    </style>
</head>
<body>
    <!-- ===== Sidebar ===== -->
    <nav class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-text">检不断 理不乱</div>
            <div class="logo-sub">血液病医检竞品知识库</div>
        </div>
        <div class="sidebar-nav">
            <a href="index.html" class="nav-item">
                <span class="nav-icon">&#x1F3E0;</span>
                <span>首页</span>
            </a>
            <a href="section1.html" class="nav-item">
                <span class="nav-icon">&#x1F9EA;</span>
                <span>新项目开展</span>
            </a>
            <a href="section2.html" class="nav-item">
                <span class="nav-icon">&#x1F3E2;</span>
                <span>学术活动动态</span>
            </a>
            <a href="section3.html" class="nav-item active">
                <span class="nav-icon">&#x1F4CA;</span>
                <span>行业风向标</span>
            </a>
        </div>
        <div class="sidebar-footer">
            v2.2 &middot; 金域医学广州市场部
        </div>
    </nav>

    <!-- ===== Main Content ===== -->
    <div class="main">
        <div class="page-header">
            <h1>政策及行业分析</h1>
            <div class="subtitle">汇总政策法规、医保变动、技术标准及市场研究</div>
        </div>

        <div class="container">
            <div class="placeholder">
                <div class="icon">&#x1F4CA;</div>
                <h2>政策及行业分析</h2>
                <p>汇总行业政策法规、医保目录变动、技术标准更新及市场研究报告，提供宏观环境分析支撑。板块1跑通后启动设计。</p>
                <div class="features">
                    <span class="feat">政策法规</span>
                    <span class="feat">医保变动</span>
                    <span class="feat">技术标准</span>
                    <span class="feat">市场报告</span>
                    <span class="feat">行业趋势</span>
                </div>
            </div>
        </div>

        <div class="page-footer">
            检不断 理不乱 v2.2 &middot; 政策及行业分析 | 设计中
        </div>
    </div><!-- end .main -->
</body>
</html>
